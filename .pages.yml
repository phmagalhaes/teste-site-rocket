media:
  input: assets/images/uploads
  output: /assets/images/uploads

content:
  - name: conteudo
    label: Página Inicial
    path: data/conteudo.json
    type: file
    fields:
      - name: titulo_hero
        label: Título do Hero
        type: string
      - name: subtitulo
        label: Subtítulo do Hero
        type: string
      - name: sobre_texto
        label: Texto 'Quem Somos'
        type: text
      - name: link_facaparte
        label: Link do formulário 'Quero fazer parte'
        type: string
        description: Deixe vazio para mostrar o aviso 'Em desenvolvimento'.
      - name: estatisticas
        label: Estatísticas
        type: object
        fields:
          - name: membros
            label: Membros
            type: string
          - name: anos
            label: Anos de equipe
            type: string
          - name: competicoes
            label: Competições
            type: string
          - name: foguetes
            label: Foguetes desenvolvidos
            type: string
      - name: foguete
        label: Foguete
        type: object
        fields:
          - name: imagem
            label: Foto do foguete
            type: image
          - name: texto
            label: Texto
            type: text
          - name: altura
            label: Altura
            type: string
          - name: massa
            label: Massa
            type: string
          - name: apogeu
            label: Apogeu
            type: string
      - name: galeria
        label: Galeria
        type: object
        list: true
        description: A primeira foto aparece em destaque (maior).
        fields:
          - name: imagem
            label: Foto
            type: image
          - name: alt
            label: Descrição (alt)
            type: string
      - name: patrocinador_principal
        label: Patrocinador Principal
        type: object
        fields:
          - name: nome
            label: Nome
            type: string
          - name: imagem
            label: Imagem
            type: image
          - name: descricao
            label: Descrição
            type: text
      - name: patrocinadores
        label: Parceiros e Apoio
        type: object
        list: true
        fields:
          - name: nome
            label: Nome
            type: string
          - name: imagem
            label: Logo
            type: image
            required: false
            description: Sem logo, o nome aparece como texto.
